[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll
;
; Public release archives are produced by scripts/package-fab.ps1, which stages
; a curated copy and strips internal research docs, tests, board files, and
; local build artifacts. These entries cover nonstandard public files and the
; wiki overlays for Unreal's plugin packaging path.
;
; /Examples/... ships the worked .pwmodel, .pwskel, .pwanim and .mgir authoring documents. The wiki
; pages cite them by path (docs/wiki-src/model.examples.md and five others), so
; omitting them here leaves those pages pointing at files the user does not have.
/README.md
/docs/wiki-src/...
/Examples/...
/Resources/...
